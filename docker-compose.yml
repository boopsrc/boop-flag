services:
  postgres:
    image: postgres:16-alpine
    container_name: boop-flag-postgres
    environment:
      POSTGRES_USER: boop
      POSTGRES_PASSWORD: boop
      POSTGRES_DB: boopflag
    ports:
      - "5432:5432"
    volumes:
      - boop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boop -d boopflag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  boop_pgdata:
